name: Refresh Profile README

on:
  push:
    branches:
      - main
      - master

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger profile README workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PROFILE_README_TOKEN }}" \
            https://api.github.com/repos/UjjwalKumarKannojiya/UjjwalKumarKannojiya/actions/workflows/update-animated-profile.yml/dispatches \
            -d '{"ref":"main"}'
