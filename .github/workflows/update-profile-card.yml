name: Update Profile Card

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

  push:
    branches:
      - master
      - main
    paths:
      - "README.md"
      - "profile_config.json"
      - "scripts/update_profile_card.py"
      - ".github/workflows/update-profile-card.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-card-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-profile-card:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create required folders
        run: |
          mkdir -p assets
          mkdir -p scripts

      - name: Generate dynamic profile card
        run: python scripts/update_profile_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: UjjwalKumarKannojiya

      - name: Commit updated profile files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/profile-card.svg profile_config.json scripts/update_profile_card.py

          if git diff --cached --quiet; then
            echo "No profile changes found."
          else
            git commit -m "chore: update dynamic GitHub profile"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
