name: Auto Update Animated Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
      - master
    paths:
      - "scripts/**"
      - ".github/workflows/update-animated-profile.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  update-profile-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate animated GitHub profile SVG
        run: python scripts/generate_animated_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
          SOCIAL_INSTAGRAM: ${{ vars.SOCIAL_INSTAGRAM }}
          SOCIAL_LINKEDIN: ${{ vars.SOCIAL_LINKEDIN }}
          SOCIAL_EMAIL: ${{ vars.SOCIAL_EMAIL }}
          PROFILE_ROLE: ${{ vars.PROFILE_ROLE }}
          PROFILE_TAGLINE: ${{ vars.PROFILE_TAGLINE }}

      - name: Commit updated animated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/animated-profile.svg README.md
          if git diff --cached --quiet; then
            echo "No visual changes to commit."
          else
            git commit -m "chore: refresh animated profile UI"
            git push
          fi
