name: Auto Update Profile UI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
      - master
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-ui.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate profile SVG
        run: python scripts/generate_profile_svg.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
          SOCIAL_INSTAGRAM: ${{ vars.SOCIAL_INSTAGRAM }}
          SOCIAL_LINKEDIN: ${{ vars.SOCIAL_LINKEDIN }}
          SOCIAL_EMAIL: ${{ vars.SOCIAL_EMAIL }}

      - name: Commit updated profile card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-card.svg README.md
          if git diff --cached --quiet; then
            echo "No profile UI changes to commit."
          else
            git commit -m "chore: auto update profile UI"
            git push
          fi
